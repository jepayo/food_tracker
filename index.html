<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Keto Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f0e8;
  --surface: #ffffff;
  --surface2: #edeae0;
  --border: #d0ccc0;
  --accent: #c8402a;
  --green: #1f7a44;
  --yellow: #b8860b;
  --text: #1a1a18;
  --muted: #8a8680;
  --tabbar-h: 60px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; display:flex; flex-direction:row; overflow:hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width:90px; min-height:100vh; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  align-items:center; padding:14px 0 16px; flex-shrink:0; gap:6px; overflow-y:auto;
}
.sidebar-logo { font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:2px; color:var(--accent); text-align:center; line-height:1.1; margin-bottom:8px; }
.sm-box { width:74px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:7px 5px 5px; text-align:center; }
.sm-box.prot { border-top:3px solid var(--green); }
.sm-box.carb { border-top:3px solid var(--yellow); }
.sm-box.kcal { border-top:3px solid var(--muted); }
.sm-val { font-family:'Bebas Neue',sans-serif; font-size:22px; line-height:1; }
.sm-val.prot { color:var(--green); }
.sm-val.carb { color:var(--yellow); }
.sm-lbl { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-family:'DM Mono',monospace; margin-top:1px; }
.sb-bar-wrap { width:74px; padding:0 2px; }
.sb-bar-track { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:2px; }
.sb-bar-fill { height:100%; border-radius:2px; background:var(--accent); transition:width 0.4s; max-width:100%; }
.sb-bar-fill.warning { background:var(--yellow); }
.sb-bar-fill.done    { background:var(--green); }
.sb-deficit { font-size:9px; font-family:'DM Mono',monospace; color:var(--accent); text-align:center; }
.sb-deficit.ok { color:var(--green); }
.sb-div { width:58px; height:1px; background:var(--border); margin:4px 0; }
.sb-nav { display:flex; flex-direction:column; gap:3px; width:100%; align-items:center; flex:1; }
.snav { width:74px; padding:9px 5px; border-radius:10px; border:none; background:none; color:var(--muted); font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; transition:all 0.15s; }
.snav .si { font-size:20px; }
.snav.active,.snav:hover { background:var(--surface2); color:var(--text); }
.sb-utils { display:flex; flex-direction:column; gap:5px; align-items:center; }
.su { width:74px; padding:6px 4px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--muted); font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-align:center; transition:all 0.15s; }
.su:hover { border-color:var(--accent); color:var(--accent); }
.su.g:hover { border-color:var(--green); color:var(--green); }
.su.y:hover { border-color:var(--yellow); color:var(--yellow); }
/* ── CONTENT ── */
.app-content { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.panel { display:none; flex-direction:column; flex:1; overflow:hidden; }
.panel.active { display:flex; }
.panel-inner { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 20px; }

/* ── MOBILE SUMMARY BAR ── */
.ms-bar { display:none; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; }
.ms-inner { display:flex; gap:8px; align-items:center; }
.ms-macro { display:flex; flex-direction:column; align-items:center; flex:1; }
.ms-v { font-family:'Bebas Neue',sans-serif; font-size:22px; line-height:1; }
.ms-v.prot { color:var(--green); }
.ms-v.carb { color:var(--yellow); }
.ms-l { font-size:9px; font-family:'DM Mono',monospace; color:var(--muted); letter-spacing:1px; }
.ms-bc { flex:2; display:flex; flex-direction:column; gap:3px; }
.ms-bt { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.ms-bf { height:100%; border-radius:3px; background:var(--accent); transition:width 0.4s; max-width:100%; }
.ms-bf.warning { background:var(--yellow); }
.ms-bf.done    { background:var(--green); }
.ms-def { font-size:10px; font-family:'DM Mono',monospace; color:var(--accent); }
.ms-def.ok { color:var(--green); }
.ms-sep { width:1px; height:36px; background:var(--border); flex-shrink:0; }

/* ── FOOD LIST ── */
.search-wrap { position:relative; margin-bottom:10px; }
.si-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; }
.search-input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 10px 9px 32px; outline:none; }
.search-input::placeholder { color:var(--muted); }
.search-input:focus { border-color:var(--accent); }
.cats { display:flex; gap:5px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px; scrollbar-width:none; }
.cats::-webkit-scrollbar { display:none; }
.cat-btn { background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:5px 10px; border-radius:20px; cursor:pointer; white-space:nowrap; transition:all 0.15s; flex-shrink:0; }
.cat-btn.active,.cat-btn:hover { background:var(--accent); border-color:var(--accent); color:white; }
.cat-btn.consumido { border-color:var(--green); color:var(--green); }
.cat-btn.consumido.active { background:var(--green); border-color:var(--green); color:white; }
.cat-btn.consumido:hover { background:var(--green); border-color:var(--green); color:white; }
.food-list { display:flex; flex-direction:column; gap:5px; }
.food-item { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
.food-item.added { border-color:var(--green); background:#e8f5ee; border-width:2px; }
.selected-header {
  font-family:'DM Mono',monospace; font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--green); padding:4px 2px 6px; display:flex; align-items:center; gap:8px;
}
.selected-header::after { content:''; flex:1; height:1px; background:var(--green); opacity:0.3; }
.rest-header {
  font-family:'DM Mono',monospace; font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--muted); padding:10px 2px 6px; display:flex; align-items:center; gap:8px;
}
.rest-header::after { content:''; flex:1; height:1px; background:var(--border); }
.food-name { font-size:13px; font-weight:600; margin-bottom:2px; }
.food-macros { display:flex; gap:8px; font-family:'DM Mono',monospace; font-size:10px; flex-wrap:wrap; }
.food-macros .p { color:var(--green); }
.food-macros .c { color:var(--yellow); }
.food-macros .g,.food-macros .u { color:var(--muted); }
.food-macros .u { font-size:9px; }
.food-total { font-size:10px; font-family:'DM Mono',monospace; color:var(--green); margin-top:3px; }
.food-controls { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.qty-btn { width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
.qty-btn:active { background:var(--accent); border-color:var(--accent); color:white; }
.qty-display { font-family:'Bebas Neue',sans-serif; font-size:22px; min-width:22px; text-align:center; }
.qty-display.active { color:var(--green); }
.empty-state { text-align:center; padding:30px; color:var(--muted); font-size:13px; }

/* ── AYUNO ── */
.fast-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding-bottom:20px; }
.fast-ring { width:160px; height:160px; transform:rotate(-90deg); }
.fast-ring-bg { fill:none; stroke:var(--border); stroke-width:10; }
.fast-ring-fill { fill:none; stroke:var(--green); stroke-width:10; stroke-linecap:round; stroke-dasharray:376; stroke-dashoffset:376; transition:stroke-dashoffset 1s linear,stroke 0.5s; }
.fast-ring-fill.warning { stroke:var(--yellow); }
.fast-ring-fill.done { stroke:var(--accent); }
.fast-cd { font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:3px; text-align:center; line-height:1; }
.fast-cd.running { color:var(--green); }
.fast-cd.warning { color:var(--yellow); }
.fast-cd.done { color:var(--accent); }
.fast-st { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); text-align:center; letter-spacing:1px; text-transform:uppercase; }
.fast-times { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.ftb { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; }
.ftl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-family:'DM Mono',monospace; margin-bottom:2px; }
.ftv { font-family:'Bebas Neue',sans-serif; font-size:22px; }
.fast-controls { width:100%; display:flex; flex-direction:column; gap:10px; }
.fast-row { display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap; }
.fl { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; white-space:nowrap; }
.fi { background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'Bebas Neue',sans-serif; font-size:20px; text-align:center; padding:5px 8px; outline:none; width:65px; }
.fi:focus { border-color:var(--accent); }
.fast-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.fb { padding:11px; border-radius:8px; border:1px solid var(--border); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; transition:all 0.15s; }
.fb.start { background:var(--green); border-color:var(--green); color:#0e0e0d; font-weight:700; }
.fb.stop { background:none; color:var(--accent); border-color:var(--accent); }
.fb.stop:active { background:var(--accent); color:white; }
.fb.manual { background:var(--surface2); color:var(--text); border-color:var(--border); }
.fb.manual:active { border-color:var(--accent); color:var(--accent); }
.fb.disabled { opacity:0.3; pointer-events:none; }
.fast-div { width:100%; height:1px; background:var(--border); }

/* ── AÑADIR ── */
.add-hint { font-size:11px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
.add-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.add-grid.full { grid-template-columns:1fr; }
.add-input { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 10px; outline:none; width:100%; }
.add-input::placeholder { color:var(--muted); font-size:12px; }
.add-input:focus { border-color:var(--accent); }
.add-select { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:9px 10px; outline:none; width:100%; cursor:pointer; }
.btn-add { width:100%; background:var(--accent); border:none; border-radius:8px; color:white; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:12px; cursor:pointer; margin-top:4px; }
.btn-add:active { opacity:0.8; }

/* ── BOTTOM TAB BAR ── */
.tabbar { display:none; position:fixed; bottom:0; left:0; right:0; height:calc(var(--tabbar-h) + var(--safe-bottom)); background:var(--surface); border-top:1px solid var(--border); z-index:100; padding-bottom:var(--safe-bottom); flex-direction:column; }
.tabbar-inner { display:flex; height:var(--tabbar-h); }
.tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:none; background:none; color:var(--muted); font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.tab-btn .ticon { font-size:22px; line-height:1; }
.tab-btn.active { color:var(--accent); }

/* ── MOBILE SHEET ── */
.sheet-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); }
.sheet-body { position:absolute; bottom:0; left:0; right:0; background:var(--surface); border-radius:16px 16px 0 0; padding:20px 16px calc(20px + var(--safe-bottom)); }
.sheet-title { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:var(--muted); margin-bottom:14px; }
.sheet-items { display:flex; flex-direction:column; gap:8px; }
.sheet-item { display:flex; align-items:center; gap:12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; border:none; text-align:left; width:100%; }
.sheet-item.g { color:var(--green); }
.sheet-item.y { color:var(--yellow); }
.sheet-item.r { color:var(--accent); }

/* ── TOAST ── */
.toast { position:fixed; bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 12px); left:50%; transform:translateX(-50%) translateY(60px); background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'DM Mono',monospace; font-size:12px; padding:9px 18px; border-radius:8px; z-index:999; transition:transform 0.3s ease; white-space:nowrap; pointer-events:none; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.ok  { border-color:var(--green); color:var(--green); }
.toast.err { border-color:var(--accent); color:var(--accent); }

/* ── RESPONSIVE ── */
@media (max-width:600px) {
  body { flex-direction:column; }
  .sidebar { display:none; }
  .tabbar { display:flex; }
  .ms-bar { display:flex; flex-direction:column; }
  .app-content { padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom)); }
  .toast { bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 12px); }
}
@media (min-width:601px) {
  .toast { bottom:24px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">KETO<br>TRACK</div>
  <div class="sm-box prot"><div class="sm-val prot" id="sb-prot">0g</div><div class="sm-lbl">Prot</div></div>
  <div class="sb-bar-wrap">
    <div class="sb-bar-track"><div class="sb-bar-fill" id="sb-bar" style="width:0%"></div></div>
    <div class="sb-deficit" id="sb-def">−170g</div>
  </div>
  <div class="sm-box carb"><div class="sm-val carb" id="sb-carb">0</div><div class="sm-lbl">Carbos / 25g</div></div>
  <div class="sm-box kcal"><div class="sm-val" id="sb-kcal">0</div><div class="sm-lbl">kcal</div></div>
  <div class="sb-div"></div>
  <nav class="sb-nav">
    <button class="snav active" data-panel="alimentos"><span class="si">🥩</span>Alimentos</button>
    <button class="snav" data-panel="ayuno"><span class="si">⏱</span>Ayuno</button>
  </nav>
  <div class="sb-div"></div>
  <div class="sb-utils">
    <button class="su g" onclick="exportJSON()">⬇ Export</button>
    <button class="su y" onclick="document.getElementById('file-import').click()">⬆ Import</button>
    <button class="su" onclick="resetDay()">↺ Día</button>
  </div>
</aside>

<input type="file" id="file-import" accept=".json" style="display:none">

<!-- MOBILE SUMMARY -->
<div class="ms-bar">
  <div class="ms-inner">
    <div class="ms-macro"><div class="ms-v prot" id="ms-prot">0g</div><div class="ms-l">Proteína</div></div>
    <div class="ms-sep"></div>
    <div class="ms-bc">
      <div class="ms-bt"><div class="ms-bf" id="ms-bar" style="width:0%"></div></div>
      <div class="ms-def" id="ms-def">Faltan 170g</div>
    </div>
    <div class="ms-sep"></div>
    <div class="ms-macro"><div class="ms-v carb" id="ms-carb">0</div><div class="ms-l">/ 25g</div></div>
    <div class="ms-sep"></div>
    <div class="ms-macro"><div class="ms-v" id="ms-kcal">0</div><div class="ms-l">kcal</div></div>
  </div>
</div>

<!-- CONTENT -->
<div class="app-content">

  <!-- ALIMENTOS -->
  <div class="panel active" id="panel-alimentos">
    <div class="panel-inner">
      <div class="search-wrap" id="search-wrap">
        <span class="si-icon">🔍</span>
        <input class="search-input" type="text" placeholder="Buscar alimento..." id="search-input" oninput="filterFoods(this.value)">
      </div>
      <div class="cats" id="cat-tabs"></div>
      <div class="food-list" id="food-list"></div>
    </div>
  </div>

  <!-- AYUNO -->
  <div class="panel" id="panel-ayuno">
    <div class="panel-inner">
      <div class="fast-wrap">
        <svg class="fast-ring" viewBox="0 0 140 140">
          <circle class="fast-ring-bg" cx="70" cy="70" r="60"/>
          <circle class="fast-ring-fill" id="fast-ring" cx="70" cy="70" r="60"/>
        </svg>
        <div>
          <div class="fast-cd" id="fast-cd">00:00:00</div>
          <div class="fast-st" id="fast-st">Sin ayuno activo</div>
        </div>
        <div class="fast-times">
          <div class="ftb"><div class="ftl">Inicio</div><div class="ftv" id="fast-t0">--:--</div></div>
          <div class="ftb"><div class="ftl">Fin previsto</div><div class="ftv" id="fast-t1">--:--</div></div>
        </div>
        <div class="fast-controls">
          <div class="fast-row">
            <span class="fl">Objetivo:</span>
            <input class="fi" type="number" id="fast-h" value="20" min="1" max="48">
            <span class="fl">horas</span>
          </div>
          <div class="fast-btns">
            <button class="fb start" id="fb-start">▶ Ahora</button>
            <button class="fb stop disabled" id="fb-stop">■ Terminar</button>
          </div>
          <div class="fast-div"></div>
          <div class="fast-row">
            <span class="fl">Desde hora:</span>
            <input class="fi" type="text" id="fast-manual" placeholder="2225" maxlength="5" style="letter-spacing:2px;">
            <button class="fb manual" id="fb-manual">▶ Fijar</button>
          </div>
        </div>
      </div>
    </div>
  </div>


</div>

<!-- BOTTOM TAB BAR -->
<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-panel="alimentos"><span class="ticon">🥩</span>Alimentos</button>
    <button class="tab-btn" data-panel="ayuno"><span class="ticon">⏱</span>Ayuno</button>
    <button class="tab-btn" id="btn-mas"><span class="ticon">⚙️</span>Más</button>
  </div>
</nav>

<!-- MOBILE SHEET -->
<div class="sheet-overlay" id="sheet">
  <div class="sheet-body" id="sheet-body">
    <div class="sheet-title">OPCIONES</div>
    <div class="sheet-items">
      <button class="sheet-item g" id="sheet-export">⬇ Exportar lista</button>
      <button class="sheet-item y" id="sheet-import">⬆ Importar lista</button>
      <button class="sheet-item r" id="sheet-reset">↺ Reiniciar día</button>
    </div>
  </div>
</div>

<script>
const TARGET_PROT = 170, TARGET_CARB = 25, TARGET_KCAL = 1900;
let foods = [
  {id:48,name:'Codillo jamón asado (Tello)',cat:'Carnes',p:23,c:1,f:7,kcal:159,unit:327,unitName:'pieza',qty:0},
  {id:49,name:'Codillo jamón asado 100g',cat:'Carnes',p:23,c:1,f:7,kcal:159,unit:100,unitName:'100g',qty:0},
  {id:2,name:'Contramuslo pollo',cat:'Carnes',p:18,c:0,f:8,kcal:150,unit:100,unitName:'100g',qty:0},
  {id:3,name:'Pavo pechuga',cat:'Carnes',p:17,c:1.2,f:1.3,kcal:85,unit:100,unitName:'100g',qty:0},
  {id:4,name:'Ternera picada',cat:'Carnes',p:20,c:0,f:15,kcal:215,unit:100,unitName:'100g',qty:0},
  {id:5,name:'Hamburguesa vacuno',cat:'Carnes',p:20,c:0,f:15,kcal:215,unit:125,unitName:'hamburguesa',qty:0},
  {id:6,name:'Redondo de pollo keto',cat:'Carnes',p:19,c:0,f:3,kcal:102,unit:100,unitName:'100g',qty:0},
  {id:7,name:'Salmón fresco',cat:'Pescado',p:20,c:0,f:13,kcal:200,unit:100,unitName:'100g',qty:0},
  {id:8,name:'Atún al natural (lata)',cat:'Pescado',p:26,c:0,f:1,kcal:115,unit:80,unitName:'lata',qty:0},

let nextId=100, activeCategory='Consumido', searchTerm='';
const cats=['Consumido','Todos','Carnes','Pescado','Huevos','Embutidos','Lácteos','Snacks','Verduras','Bebidas','Otros'];

// NAV
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  var el = document.getElementById('panel-'+name);
  if(el) el.classList.add('active');
  document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active', b.dataset.panel===name));
}

// SHEET
function showSheet(){document.getElementById('sheet').style.display='block';}
function hideSheet(){document.getElementById('sheet').style.display='none';}

// TOTALS
function getTotals(){return foods.reduce((a,f)=>{var x=(f.qty*f.unit)/100;a.p+=f.p*x;a.c+=f.c*x;a.kcal+=f.kcal*x;return a;},{p:0,c:0,kcal:0});}

function updateSummary(){
  var t=getTotals(),rp=Math.round(t.p),rc=Math.round(t.c),rk=Math.round(t.kcal);
  var pct=Math.min((t.p/TARGET_PROT)*100,100);
  var def=TARGET_PROT-rp;
  var bc=pct>=100?'done':pct>=60?'warning':'danger';
  var dt=def<=0?'✓ OK':'−'+def+'g';
  var dc=def<=0?'ok':'';
  var carbColor=rc>=TARGET_CARB?'var(--accent)':rc>=(TARGET_CARB*0.75)?'var(--yellow)':'var(--green)';
  // sidebar
  document.getElementById('sb-prot').textContent=rp+'g';
  var sc=document.getElementById('sb-carb');sc.textContent=rc+'g';sc.style.color=carbColor;
  document.getElementById('sb-kcal').textContent=rk;
  var sb=document.getElementById('sb-bar');sb.style.width=pct+'%';sb.className='sb-bar-fill '+bc;
  var sd=document.getElementById('sb-def');sd.textContent=dt;sd.className='sb-deficit '+dc;
  // mobile
  document.getElementById('ms-prot').textContent=rp+'g';
  var mc=document.getElementById('ms-carb');mc.textContent=rc+'g';mc.style.color=carbColor;
  document.getElementById('ms-kcal').textContent=rk;
  var mb=document.getElementById('ms-bar');mb.style.width=pct+'%';mb.className='ms-bf '+bc;
  var md=document.getElementById('ms-def');md.textContent=def<=0?'✓ Objetivo':'Faltan '+def+'g';md.className='ms-def '+dc;
}

// FOODS
function renderCats(){
  document.getElementById('cat-tabs').innerHTML=cats.map(c=>{
    var isCons=c==='Consumido';
    var isActive=c===activeCategory;
    var cls='cat-btn'+(isCons?' consumido':'')+(isActive?' active':'');
    var label=isCons?'✓ Consumido':c;
    return `<button class="${cls}" onclick="setCategory('${c}')">${label}</button>`;
  }).join('');
}
function setCategory(c){
  activeCategory=c;
  // Hide search in Consumido, show in categories
  document.getElementById('search-wrap').style.display=c==='Consumido'?'none':'block';
  renderCats();renderFoods();
}
function filterFoods(v){searchTerm=v.toLowerCase();renderFoods();}
function renderFoods(){
  var list=document.getElementById('food-list');
  var html='';

  if(activeCategory==='Consumido'){
    // Show only selected items
    var selected=foods.filter(f=>f.qty>0);
    if(!selected.length){
      list.innerHTML='<div class="empty-state">Nada consumido todavía hoy</div>';return;
    }
    html+=`<div class="selected-header">EN EL DÍA — ${selected.length} alimento${selected.length>1?'s':''}</div>`;
    html+=selected.map(f=>foodHTML(f)).join('');
  } else if(activeCategory==='Todos'){
    var filtered=foods.filter(f=>f.name.toLowerCase().includes(searchTerm));
    if(!filtered.length){list.innerHTML='<div class="empty-state">Sin resultados</div>';return;}
    html+=filtered.map(f=>foodHTML(f)).join('');
  } else {
    // Show category filtered list
    var filtered=foods.filter(f=>
      f.cat===activeCategory &&
      f.name.toLowerCase().includes(searchTerm)
    );
    if(!filtered.length){list.innerHTML='<div class="empty-state">Sin resultados</div>';return;}
    html+=filtered.map(f=>foodHTML(f)).join('');
  }

  list.innerHTML=html;
}

function foodHTML(f){
  var pu=((f.p*f.unit)/100).toFixed(1),cu=((f.c*f.unit)/100).toFixed(1),fu=((f.f*f.unit)/100).toFixed(1);
  var tg=f.qty>0?f.qty*f.unit:null,tp=f.qty>0?((f.p*f.qty*f.unit)/100).toFixed(1):null;
  return `<div class="food-item ${f.qty>0?'added':''}">
    <div>
      <div class="food-name">${f.name}</div>
      <div class="food-macros"><span class="p">P ${pu}g</span><span class="c">C ${cu}g</span><span class="g">G ${fu}g</span><span class="u">/ ${f.unitName} (${f.unit}g)</span></div>
      ${tg?`<div class="food-total">→ ${tg}g · P ${tp}g</div>`:''}
    </div>
    <div class="food-controls">
      <button class="qty-btn" onclick="changeQty(${f.id},-1)">−</button>
      <div class="qty-display ${f.qty>0?'active':''}">${f.qty}</div>
      <button class="qty-btn" onclick="changeQty(${f.id},1)">+</button>
    </div>
  </div>`;
}

// STORAGE
var LS_F='keto_foods',LS_Q='keto_qty';
function saveFoods(){localStorage.setItem(LS_F,JSON.stringify(foods.filter(f=>f.id>=100)));}
function saveQty(){var q={};foods.forEach(f=>{if(f.qty>0)q[f.id]=f.qty;});localStorage.setItem(LS_Q,JSON.stringify(q));}
function loadStorage(){
  try{var c=JSON.parse(localStorage.getItem(LS_F)||'[]');c.forEach(f=>{if(!foods.find(x=>x.id===f.id))foods.push(f);if(f.id>=nextId)nextId=f.id+1;});}catch(e){}
  try{var q=JSON.parse(localStorage.getItem(LS_Q)||'{}');foods.forEach(f=>{f.qty=q[f.id]||0;});}catch(e){}
}

// EXPORT/IMPORT
function exportJSON(){
  var b=new Blob([JSON.stringify({version:1,foods:foods.map(f=>({...f,qty:0}))},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='keto_alimentos.json';a.click();
  toast('Lista exportada ✓','ok');
}
function importJSON(ev){
  var file=ev.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result),imp=d.foods||d;
      if(!Array.isArray(imp))throw new Error();
      imp.forEach(f=>{f.qty=0;var i=foods.findIndex(x=>x.id===f.id);if(i>=0)foods[i]=f;else{foods.push(f);if(f.id>=nextId)nextId=f.id+1;}});
      saveFoods();renderFoods();updateSummary();toast(imp.length+' alimentos importados ✓','ok');
    }catch(e){toast('Error al leer el fichero','err');}
    ev.target.value='';
  };
  r.readAsText(file);
}

// RESET
function resetDay(){foods.forEach(f=>f.qty=0);saveQty();updateSummary();renderFoods();toast('Contadores a cero','');}

// TOAST
var _tt;
function toast(msg,type){
  var el=document.getElementById('_toast');
  if(!el){el=document.createElement('div');el.id='_toast';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.className='toast '+(type||'');
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2200);
}

// CHANGE QTY
function changeQty(id,delta){
  var f=foods.find(x=>x.id===id);if(!f)return;
  f.qty=Math.max(0,f.qty+delta);saveQty();updateSummary();renderFoods();
}

// FASTING
var LS_FAST='keto_fast',fastIv=null;
function saveFast(d){localStorage.setItem(LS_FAST,JSON.stringify(d));}
function loadFast(){try{return JSON.parse(localStorage.getItem(LS_FAST));}catch(e){return null;}}
function f2(n){return String(Math.floor(n)).padStart(2,'0');}
function fmtT(ts){var d=new Date(ts);return f2(d.getHours())+':'+f2(d.getMinutes());}

function startFast(){
  var h=parseFloat(document.getElementById('fast-h').value)||20;
  var data={startTs:Date.now(),targetH:h};saveFast(data);runFast(data);toast('Ayuno iniciado ✓','ok');
}
function stopFast(){
  clearInterval(fastIv);fastIv=null;localStorage.removeItem(LS_FAST);resetFastUI();toast('Ayuno terminado','');
}
function setManual(){
  try{
    var raw=(document.getElementById('fast-manual').value||'').trim();
    // Normalize: accept 2225 or 22:25
    var val=raw.replace(/[^0-9]/g,'');
    if(val.length===3) val='0'+val; // e.g. 900 → 0900
    if(val.length!==4){toast('Formato HH:MM o HHMM','err');return;}
    var h=parseInt(val.substring(0,2),10),m=parseInt(val.substring(2,4),10);
    if(isNaN(h)||isNaN(m)||h>23||m>59){toast('Hora inválida','err');return;}
    var now=new Date(),start=new Date();start.setHours(h,m,0,0);
    if(start>now)start.setDate(start.getDate()-1);
    var th=parseFloat(document.getElementById('fast-h').value)||20;
    var data={startTs:start.getTime(),targetH:th};saveFast(data);runFast(data);
    toast('Ayuno desde '+f2(h)+':'+f2(m),'ok');
  }catch(e){toast('Error al fijar hora','err');}
}
function resetFastUI(){
  document.getElementById('fast-cd').textContent='00:00:00';
  document.getElementById('fast-cd').className='fast-cd';
  document.getElementById('fast-st').textContent='Sin ayuno activo';
  document.getElementById('fast-t0').textContent='--:--';
  document.getElementById('fast-t1').textContent='--:--';
  document.getElementById('fast-ring').style.strokeDashoffset=376;
  document.getElementById('fast-ring').className='fast-ring-fill';
  document.getElementById('fb-start').classList.remove('disabled');
  document.getElementById('fb-stop').classList.add('disabled');
}
function runFast(data){
  clearInterval(fastIv);
  var st=data.startTs,th=data.targetH,tms=th*3600000,et=st+tms;
  document.getElementById('fast-t0').textContent=fmtT(st);
  document.getElementById('fast-t1').textContent=fmtT(et);
  document.getElementById('fb-start').classList.add('disabled');
  document.getElementById('fb-stop').classList.remove('disabled');
  document.getElementById('fast-h').value=th;
  function tick(){
    var now=Date.now(),el=now-st,rem=et-now;
    var pct=Math.min(el/tms,1);
    var ring=document.getElementById('fast-ring');
    ring.style.strokeDashoffset=376-(376*pct);
    var cd=document.getElementById('fast-cd'),s=document.getElementById('fast-st');
    if(rem>0){
      var h=Math.floor(rem/3600000),m=Math.floor((rem%3600000)/60000),sec=Math.floor((rem%60000)/1000);
      cd.textContent=f2(h)+':'+f2(m)+':'+f2(sec);
      var elH=el/3600000;
      if(elH>=th*0.85){cd.className='fast-cd warning';ring.className='fast-ring-fill warning';s.textContent='¡Casi! Quedan '+f2(h)+'h '+f2(m)+'min';}
      else{cd.className='fast-cd running';ring.className='fast-ring-fill';s.textContent='Llevas '+Math.floor(elH)+'h '+f2((elH-Math.floor(elH))*60)+'min';}
    }else{
      var ov=Math.abs(rem),h=Math.floor(ov/3600000),m=Math.floor((ov%3600000)/60000),sec=Math.floor((ov%60000)/1000);
      cd.textContent='+'+f2(h)+':'+f2(m)+':'+f2(sec);
      cd.className='fast-cd done';ring.className='fast-ring-fill done';ring.style.strokeDashoffset=0;
      s.textContent='🎯 '+th+'h completadas';
    }
  }
  tick();fastIv=setInterval(tick,1000);
}
function initFast(){var d=loadFast();if(d)runFast(d);}

// ── INIT ──
loadStorage();initFast();renderCats();renderFoods();updateSummary();
document.getElementById('search-wrap').style.display='none';
